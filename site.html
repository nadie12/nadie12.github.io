            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);

                window.addEventListener('scroll', handleScroll, { passive: true });
                return () => window.removeEventListener('scroll', handleScroll);

            useEffect(() => {
                const sections = NAV_ITEMS
                    .map(item => document.getElementById(item.toLowerCase()))
                    .filter(Boolean);
                const observer = new IntersectionObserver(
                    entries => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) setActive(entry.target.id);
                        });

                    <SectionHeading eyebrow="01 / About">A bit more detail</SectionHeading>

                    <div className="grid lg:grid-cols-3 gap-12">
                        <motion.div {...reveal()} className="lg:col-span-2 space-y-5 text-zinc-400 text-lg leading-relaxed max-w-2xl">
                            {portfolioData.about.map((paragraph, i) => (
                                <p key={i}>{paragraph}</p>
                            ))}
                        </motion.div>

                        <motion.dl {...reveal(0.1)} className="glass-card rounded-2xl p-6 space-y-5 h-fit text-sm">
                            <div>
                                <dt className="text-zinc-500 mb-1">Based in</dt>
                                <dd className="text-white font-medium">{portfolioData.location}</dd>
                            </div>
                            <div>
                                <dt className="text-zinc-500 mb-1">Currently</dt>
                                <dd className="text-white font-medium">Software Engineer at Xansium</dd>
                            </div>
                            <div>
                                <dt className="text-zinc-500 mb-1">Focus</dt>
                                <dd className="text-white font-medium">Salesforce, LWC, Apex, integrations</dd>
                            </div>
                            <div>
                                <dt className="text-zinc-500 mb-1">Education</dt>
                                <dd className="text-white font-medium">{portfolioData.education}</dd>
                            </div>
                            <div>
                                <dt className="text-zinc-500 mb-1">Email</dt>
                                <dd>
                                    <a href={`mailto:${portfolioData.email}`} className="text-accent-400 hover:text-accent-300 transition-colors break-all">
                                        {portfolioData.email}
                                    </a>
                                </dd>
                            </div>
                        </motion.dl>
                    </div>
                </div>
            </section>
        );

        const Skills = () => (
            <section id="skills" className="py-24 relative">
                <div className="container mx-auto px-6">
                    <SectionHeading eyebrow="02 / Toolkit">What I work with</SectionHeading>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {Object.entries(portfolioData.skills).map(([category, items], idx) => (
                            <motion.div
                                key={category}
                                {...reveal(idx * 0.08)}
                                className="glass-card p-6 rounded-2xl hover:border-accent-500/30 transition-colors group"
                            >
                                <h3 className="text-lg font-semibold text-white mb-4 flex items-center gap-2">
                                    <span className="w-2 h-2 bg-accent-500 rounded-full group-hover:scale-150 transition-transform"></span>
                                    {category}
                                </h3>
                                <ul className="flex flex-wrap gap-2">
                                    {items.map(skill => (
                                        <li key={skill} className="px-3 py-1 text-xs font-medium text-zinc-300 bg-zinc-900/80 border border-zinc-800 rounded-md">
                                            {skill}
                                        </li>
                                    ))}
                                </ul>
                            </motion.div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const Experience = () => (
            <section id="experience" className="py-24 bg-zinc-950/50">
                <div className="container mx-auto px-6">
                    <SectionHeading eyebrow="03 / Experience">Where I've worked</SectionHeading>

                    <div className="relative space-y-14">
                        {/* One continuous timeline rail, rather than a segment per job. */}
                        <div className="hidden md:block absolute left-[200px] top-3 bottom-0 w-px bg-gradient-to-b from-zinc-800 via-zinc-800 to-transparent" aria-hidden="true"></div>

                        {portfolioData.experience.map((job, idx) => (
                            <motion.div key={idx} {...reveal(0, 'x')} className="relative">
                                <div className="md:flex gap-12">
                                    <div className="md:w-[200px] flex-shrink-0 mb-4 md:mb-0">
                                        <span className="text-accent-400 font-mono text-sm">{job.period}</span>
                                        <h3 className="text-xl font-bold text-white mt-1">{job.role}</h3>
                                        <p className="text-zinc-400">{job.company}</p>
                                    </div>

                                    <div className="glass-card p-6 md:p-8 rounded-2xl flex-grow relative">
                                        {/* Dot: card sits 248px in (200px rail + 48px gap), so -56px
                                            puts this 16px dot's centre exactly on the rail. */}
                                        <div className="hidden md:block absolute -left-[56px] top-8 w-4 h-4 rounded-full bg-zinc-950 border-4 border-accent-500" aria-hidden="true"></div>

                                        <p className="text-zinc-300 mb-6 border-l-2 border-accent-500/40 pl-4">
                                            {job.description}
                                        </p>

                                        <div className="space-y-7">
                                            {job.groups.map((group, g) => (
                                                <div key={g}>
                                                    {group.client && (
                                                        <h4 className="text-sm font-semibold text-white mb-3 pb-2 border-b border-zinc-800">
                                                            {group.client}
                                                        </h4>
                                                    )}
                                                    <ul className="space-y-3">
                                                        {group.points.map((point, i) => (
                                                            <li key={i} className="flex items-start gap-3 text-zinc-400 text-sm leading-relaxed">
                                                                <Icon name="check" size={16} className="text-accent-500 mt-1 flex-shrink-0" />
                                                                <span>{point}</span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </motion.div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const Projects = () => (
            <section id="projects" className="py-24">
                <div className="container mx-auto px-6">
                    <SectionHeading eyebrow="04 / Projects">Selected work</SectionHeading>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        {portfolioData.projects.map((project, idx) => (
                            <motion.div
                                key={idx}
                                {...reveal(idx * 0.08)}
                                whileHover={reduceMotion ? undefined : { y: -5 }}
                                className="glass-card rounded-2xl overflow-hidden group flex flex-col"
                            >
                                <div className="h-40 bg-zinc-900 relative overflow-hidden">
                                    <div className="absolute inset-0 bg-gradient-to-br from-accent-800/25 to-zinc-900/80 z-10"></div>
                                    <div className="absolute inset-0 opacity-20" style={{
                                        backgroundImage: 'radial-gradient(circle at 2px 2px, rgba(255,255,255,0.15) 1px, transparent 0)',
                                        backgroundSize: '24px 24px'
                                    }}></div>
                                    <span className="absolute top-4 right-5 z-20 font-mono text-4xl font-bold text-white/10" aria-hidden="true">
                                        {String(idx + 1).padStart(2, '0')}
                                    </span>
                                    <div className="absolute bottom-4 left-6 z-20">
                                        <span className="text-xs font-bold text-accent-400 uppercase tracking-wider">{project.client}</span>
                                    </div>
                                </div>

                                <div className="p-6 md:p-8 flex flex-col flex-grow">
                                    <h3 className="text-2xl font-bold text-white mb-3 group-hover:text-accent-400 transition-colors">
                                        {project.title}
                                    </h3>
                                    <p className="text-zinc-400 mb-6 leading-relaxed flex-grow">
                                        {project.description}
                                    </p>
                                    <ul className="flex flex-wrap gap-2">
                                        {project.tags.map(tag => (
                                            <li key={tag} className="text-xs font-medium px-2 py-1 rounded bg-zinc-800 text-zinc-300 border border-zinc-700">
                                                {tag}
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            </motion.div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer id="contact" className="py-16 border-t border-zinc-900 bg-zinc-950">
                <div className="container mx-auto px-6 text-center">
                    <h2 className="text-2xl md:text-3xl font-bold text-white mb-3">Get in touch</h2>
                    <p className="text-zinc-400 mb-8 max-w-md mx-auto">
                        Happy to talk about Salesforce work, government delivery, or anything else on this page.
                    </p>

                    <a
                        href={`mailto:${portfolioData.email}`}
                        className="inline-flex items-center gap-2 px-6 py-3 mb-8 bg-white text-black rounded-full font-medium hover:bg-zinc-200 transition-colors"
                    >
                        <Icon name="mail" size={18} /> {portfolioData.email}
                    </a>

                    <div className="flex justify-center gap-4 mb-10">
                        {portfolioData.socials.map(social => (
                            <a
                                key={social.name}
                                href={social.url}
                                target="_blank" rel="noopener noreferrer"
                                aria-label={social.name}
                                className="p-3 glass-card rounded-full text-zinc-300 hover:bg-accent-600 hover:text-white transition-all"
                            >
                                <Icon name={social.icon} size={20} />
                            </a>
                        ))}
                    </div>

                    <p className="text-zinc-600 text-sm">
                        © {new Date().getFullYear()} {portfolioData.name} · {portfolioData.location}
                    </p>
                </div>
            </footer>
        );

        const App = () => (
            <div className="selection:bg-accent-500/30 selection:text-accent-200">
                <Navbar />
                <main id="main">
                    <Hero />
                    <About />
                    <Skills />
                    <Experience />
                    <Projects />
                </main>
                <Footer />
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
